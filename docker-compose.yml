services:
  postgres:
    image: postgres:16-alpine
    container_name: credit_card_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  fastapi-agent:
    build:
      context: ./fastapi-agent
      dockerfile: Dockerfile
    container_name: credit_card_fastapi_agent
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/banking_db
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/deepseek-v4-flash-0731}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  go-gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    container_name: credit_card_go_gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: "academic-project-secret-key-2026"
      AGENT_SERVICE_URL: "http://fastapi-agent:8000"
    ports:
      - "8080:8080"
    depends_on:
      - fastapi-agent
    networks:
      - platform-net

  react-ui:
    build:
      context: ./react-ui
      dockerfile: Dockerfile
    container_name: credit_card_react_ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - go-gateway
    networks:
      - platform-net

volumes:
  postgres_data:

networks:
  platform-net:
    driver: bridge
